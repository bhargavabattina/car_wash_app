name: car_wash_app
description: A premium on-demand car wash application with customer, technician, and admin interfaces.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.9

  # Location & Maps
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0

  # Image Handling
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0

  # Payment Integration
  razorpay_flutter: ^1.3.6

  # HTTP & API
  http: ^1.1.2

  # Local Storage
  shared_preferences: ^2.2.2

  # Date & Time
  intl: ^0.18.1

  # URL Launcher
  url_launcher: ^6.2.2

  # Pin Code Input
  pin_code_fields: ^8.0.1

  # Permissions
  permission_handler: ^11.1.0

  # Animations & Modern UI
  animate_do: ^3.1.2
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # Charts & Data Visualization (for admin)
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^24.1.41

  # Responsive Design
  responsive_framework: ^1.1.1
  flutter_screenutil: ^5.9.0

  # Platform Detection
  universal_html: ^2.2.4
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
